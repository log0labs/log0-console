name: Bug report
description: Report a problem with the log0 console
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do not report security
        vulnerabilities here - see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, console version/commit, and backend version if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console/network output
      description: Relevant browser console or network errors. Do not paste secrets or tokens.
      render: shell
    validations:
      required: false
